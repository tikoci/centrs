version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: has-flag
        update-types:
          - version-update:semver-major
      # Types track the Bun runtime pinned in packageManager (which every
      # workflow reads) and the Dockerfile; bump them by hand with that pin,
      # not alone (#438).
      - dependency-name: "@types/bun"
    groups:
      npm:
        patterns:
          - "*"
