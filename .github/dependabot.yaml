version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: has-flag
        update-types:
          - version-update:semver-major
      # Types track the Bun runtime pinned in workflows, Dockerfile and
      # packageManager; bump them together with that pin, not alone.
      - dependency-name: "@types/bun"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      npm:
        patterns:
          - "*"
