name: CodeQL
run-name: CodeQL • ${{ github.event_name }} • ${{ github.ref_name }}

# Security + quality scanning lives in its own workflow (not qa.yaml) so it runs
# on the same cadence regardless of the heavy CHR matrix: every PR and push to
# main (catch before + at merge), a weekly cron, and on demand. Keeping it
# separate is what lets qa.yaml drop its PR trigger without losing CodeQL on PRs.
# See .github/instructions/github-security-quality.instructions.md and SECURITY.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
