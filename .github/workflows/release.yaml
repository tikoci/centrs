name: Release
run-name: Release • ${{ inputs.channel }}${{ inputs.dry-run && ' (dry run)' || '' }} • ${{ github.ref_name }}

# One-button publish of @tikoci/centrs from main (#484):
#
#   gh workflow run release.yaml                     # @next (default)
#   gh workflow run release.yaml -f channel=latest   # stable
#   gh workflow run release.yaml -f dry-run=true     # gates checked, CHR gate reported, nothing published
#
# It publishes the commit the dispatch ran on (github.sha), never an older one —
# npm provenance attests that commit.
#
#   next:   <base>-next.<run_number> → npm tag "next". package.json is rewritten
#           in the runner only: no commit, no PR, no git tag, no GitHub Release.
#           <base> is package.json's version without its suffix (0.1.9-next →
#           0.1.9); a plain version that already shipped bumps the patch.
#   latest: the committed plain version → npm tag "latest", "next" moved to it,
#           tag v<version> + GitHub Release from its CHANGELOG section. Commit the
#           version and the dated `## X.Y.Z — YYYY-MM-DD` heading first.
#
# Gate: lint/unit/build on the commit (~1.5 min), and the CHR gate reuses main's
# QA on that commit instead of sweeping again — wait if it is running, sweep via
# qa.yaml only if every run was cancelled, refuse if it failed. The decisions are
# scripts/release-plan.ts (unit-tested). A dry run reports the CHR gate as it
# stands — it neither waits nor sweeps — so a green dry run is not a QA result.
# A pushed v* tag no longer triggers anything.
#
# Requires NPM_TOKEN (npm automation token with publish access to @tikoci/centrs)
# resolvable as `secrets.NPM_TOKEN` — a repo secret, or a tikoci org secret with
# centrs in its repository access.
# Policy: .github/instructions/ci-test-tiers-and-release-versioning.instructions.md.
#
# Injection safety: every workflow value used in a `run:` block arrives via `env:`
# (or a built-in like $GITHUB_SHA) — never inlined `${{ }}`.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "next = <base>-next.<run_number> on npm tag next; latest = the committed version"
        type: choice
        options:
          - next
          - latest
        default: next
      dry-run:
        description: "Check the version gates and run lint/unit/build; report the CHR gate as it stands (no wait, no sweep); publish nothing"
        type: boolean
        default: false

permissions:
  contents: read
# Never two releases at once; never cancel one mid-flight.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan + CHR gate
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      npm-tag: ${{ steps.plan.outputs.npm-tag }}
      base: ${{ steps.plan.outputs.base }}
      qa: ${{ steps.plan.outputs.qa }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # setup-bun action v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Plan the version and check main's QA on this commit
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
          DRY_RUN: ${{ inputs.dry-run }}
        # A dry run reports the CHR gate as it stands instead of waiting on it.
        run: |
          set -eo pipefail
          args=(plan --channel "$CHANNEL")
          if [ "$DRY_RUN" = "true" ]; then args+=(--no-wait); fi
          bun run scripts/release-plan.ts "${args[@]}"

  checks:
    name: Lint, unit, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # setup-bun action v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint CI, unit, build
        run: bun run ci

  # Only when main's QA never finished on this commit (a newer push cancelled
  # it). qa.yaml's accumulate-and-gate commits to qa-history, and a reusable
  # workflow cannot get more than its caller grants, hence contents: write.
  qa:
    name: CHR sweep
    needs: plan
    if: ${{ needs.plan.outputs.qa == 'sweep' && !inputs.dry-run }}
    permissions:
      contents: write
    uses: ./.github/workflows/qa.yaml
    with:
      routeros_channel: all

  publish:
    name: Publish to npm
    needs: [plan, checks, qa]
    # qa=wait only comes out of a dry run (the plan refuses on a wait timeout);
    # the last clause keeps a real publish from ever riding on one.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.checks.result == 'success' && (needs.qa.result == 'success' || needs.qa.result == 'skipped') && (needs.plan.outputs.qa != 'wait' || inputs.dry-run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      NPM_TAG: ${{ needs.plan.outputs.npm-tag }}
      DRY_RUN: ${{ inputs.dry-run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun 1.4.2
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # setup-bun action v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true
      - name: Setup Node (npm registry auth + provenance)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The published package.json carries the planned version, so
      # `centrs --version` names the exact build. Never committed.
      - name: Set the package version
        run: bunx npm pkg set "version=$VERSION"
      # `secrets.NPM_TOKEN` must resolve on this runner. Prove that BEFORE
      # attempting publish (and on a dry-run, so a dispatch validates it without
      # publishing). The value is masked by Actions; only its presence is logged.
      - name: Verify NPM_TOKEN reaches this runner
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN did not reach this runner. Set it as a repo secret (Settings → Secrets and variables → Actions), or — if it is a tikoci org secret — add centrs to its repository access."
            exit 1
          fi
          echo "NPM_TOKEN is present and non-empty (value masked by Actions)."
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eo pipefail
          PKG_NAME=$(node -pe "require('./package.json').name")
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — not publishing $PKG_NAME@$VERSION (would use npm tag '$NPM_TAG')"
            bunx npm pack --dry-run
            exit 0
          fi
          bunx npm publish --access public --provenance --tag "$NPM_TAG"
          # A stable release carries 'next' forward with it so `@next` never
          # resolves older than `@latest` between cuts.
          if [ "$NPM_TAG" = "latest" ]; then
            bunx npm dist-tag add "$PKG_NAME@$VERSION" next
          fi
          echo "- Published \`$PKG_NAME@$VERSION\` → npm tag \`$NPM_TAG\`" >> "$GITHUB_STEP_SUMMARY"
      # After publish: if this step fails, the version is already on npm and a
      # re-dispatch is refused, so create the release by hand with the same command.
      - name: Tag and GitHub Release (latest only)
        if: ${{ needs.plan.outputs.npm-tag == 'latest' && !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          bun run scripts/release-plan.ts notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
