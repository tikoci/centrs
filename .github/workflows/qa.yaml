name: QA
run-name: QA • ${{ github.event_name }} • ${{ github.ref_name }}

# QA is the *definitive* RouterOS surface: every active channel booted on a real
# CHR via quickchr, with results recorded to a bun:sqlite store. It runs
# nightly, on demand, and is workflow_call-able by release.yaml, which sweeps
# only when no nightly swept the commit it publishes (#484). It no longer runs
# on push to main: one sweep per change was two full sweeps per PR.
#
# The nightly sweeps only when main's HEAD or a resolved RouterOS channel
# version changed since the last completed nightly (scripts/qa-nightly.ts,
# `preflight`); the run that sweeps commits that fingerprint to the qa-history
# branch for the next night. A skipped night reports success having booted
# nothing — release.yaml and ci.yaml's main-health job read the jobs, not the
# run conclusion, so they pass over it. Dispatch can apply the same pre-flight
# (`if-changed`); a release sweep never does.
#
# The fast lint/unit (all three OSes)/build/CHR-smoke gate is ci.yaml; security
# scanning is codeql.yaml — neither runs here.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      if-changed:
        description: Apply the nightly pre-flight — skip the sweep when main's HEAD and every channel version match the last nightly
        type: boolean
        default: false
      routeros_channel:
        description: RouterOS channel — "all" fans the active set into one matrix run
        type: choice
        options:
          - stable
          - long-term
          - testing
          - development
          - all
        default: all
      routeros_version:
        description: Explicit RouterOS version for CHR; overrides routeros_channel
        type: string
        default: ""
  workflow_call:
    inputs:
      routeros_channel:
        description: RouterOS channel; "all" = the active set
        type: string
        default: all
      routeros_version:
        description: Explicit RouterOS version; overrides routeros_channel
        type: string
        default: ""

permissions:
  contents: read

# Every run gets its own group, so a nightly, a dispatch and a release sweep
# never cancel one another (a shared group once let a release sweep cancel
# main's QA, #484).
concurrency:
  group: qa-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Recency-aware matrix axis (B-2 / quickchr#3). quickchr resolves the live
  # channel→version map and returns the channels worth booting — released
  # (stable, long-term) always, plus any pre-release (testing, development) at or
  # ahead of stable, since the four channels are not monotonically ordered
  # (testing can lag stable as a stale rc, then leapfrog it). A concrete dispatch
  # channel pins a single leg; "all" / schedule / the release sweep fan the
  # active set. The "what's worth booting" smarts live in quickchr; centrs keeps
  # only the must-pass gate (see accumulate-and-gate).
  #
  # The same job is the nightly pre-flight: on a schedule (or a dispatch with
  # `if-changed`) it first decides whether anything changed since the last
  # nightly. `run` defaults to true whenever the pre-flight did not run.
  resolve-matrix:
    name: Pre-flight + active channels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.preflight.outputs.run || 'true' }}
      fingerprint: ${{ steps.preflight.outputs.fingerprint }}
      channels: ${{ steps.matrix.outputs.channels }}
    steps:
      # Read-only job (resolves the matrix axis; no commits), so it needs no git
      # credentials — drop them to limit token exposure.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # quickchr 0.4.1+ resolves MikroTik hosts over public DNS, so this works on
      # GitHub runners; if recency still can't be resolved the script falls back
      # to the released channels (never drops a must-pass leg). The requested
      # channel/version arrive via env (never inlined into the run block); an
      # explicit version pins a single leg rather than fanning the active set.
      # Reads the previous fingerprint from the qa-history branch through the
      # contents API (contents: read); any failure there answers "sweep".
      - name: Nightly pre-flight (sweep only if something changed)
        id: preflight
        if: ${{ github.event_name == 'schedule' || inputs.if-changed }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run scripts/qa-nightly.ts preflight --summary "$GITHUB_STEP_SUMMARY"
      - name: Resolve active channel set
        id: matrix
        if: ${{ steps.preflight.outputs.run != 'false' }}
        env:
          REQUESTED_CHANNEL: ${{ inputs.routeros_channel || '' }}
          REQUESTED_VERSION: ${{ inputs.routeros_version || '' }}
        run: |
          bun run scripts/qa-active-channels.ts \
            --requested-channel "$REQUESTED_CHANNEL" \
            --requested-version "$REQUESTED_VERSION" \
            --summary "$GITHUB_STEP_SUMMARY"

  # Drift gate for the generated `src/explain/menus.ts` (#207). It lives here
  # rather than in ci.yaml's offline `lint:ci` because checking means refetching
  # the pinned restraml trees over the network, and a per-PR gate that can fail
  # on someone else's Pages deploy is a flaky gate. Nothing else in QA depends on
  # it, so it runs alongside the CHR matrix rather than ahead of it.
  #
  # A failure here is not automatically a bug: the pinned trees are supposed to
  # be immutable, so drift means restraml republished one. Read the diff before
  # committing a regeneration — a path moving from `cmd` to `dir` would let the
  # analyzer clear a write, which is the one direction that costs correctness.
  explain-menus-drift:
    name: Explain menu table drift
    needs: resolve-matrix
    if: ${{ needs.resolve-matrix.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check src/explain/menus.ts against the pinned restraml trees
        run: bun run explain:menus:check

  # Drift REPORT for `src/explain/catalog.ts` (#228). Deliberately a separate,
  # non-blocking job, because its second source is a different KIND of source.
  #
  # `menus.ts` reads four pinned, immutable trees, so drift there is an anomaly
  # worth reddening a run. CLI Reference is current-only and moves whenever
  # MikroTik edits the manual — a routine upstream event with no bearing on
  # whether this code is correct. `release.yaml` calls this whole workflow and
  # gates `publish` on it, so a hard failure here would let an upstream
  # documentation edit block an npm release. #228 stages the audit as
  # reporting-not-failing for exactly this reason.
  #
  # `continue-on-error` keeps the report visible without blocking; the summary
  # says what to do when it fires.
  explain-catalog-drift:
    name: Explain catalog drift (report)
    needs: resolve-matrix
    if: ${{ needs.resolve-matrix.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check src/explain/catalog.ts against CLI Reference and the trees
        id: catalog
        run: bun run explain:catalog:check
      - name: Report drift
        if: failure() && steps.catalog.outcome == 'failure'
        run: |
          if grep -qF "<!-- explain-catalog-drift -->" "$GITHUB_STEP_SUMMARY" 2>/dev/null; then
            echo "Drift report already present in summary (from check step); skipping duplicate."
          else
            {
              echo "No structured drift report was produced. This is a REPORT, not a gate."
              echo "Run \`bun run explain:catalog\` and review \`git diff src/explain/catalog.ts\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  chr-matrix:
    name: CHR • ${{ matrix.routeros_channel }}${{ inputs.routeros_version && format(' • {0}', inputs.routeros_version) || '' }}
    needs: resolve-matrix
    if: ${{ needs.resolve-matrix.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    # Budget = warm-cache suite + one cold image download. Each test file boots
    # its own CHR (~25s, GH#612), so the warm suite alone was ~34 minutes by
    # 2026-11-02; at 35 that cancelled every leg of release run 41580906765 on its
    # last file with every assertion green. A leg whose image cache missed also
    # pays for one cold download from download.mikrotik.com (~0.2 MB/s to
    # runners: 4-8 minutes for a 43 MB image, plus up to 300s for a timed-out
    # first attempt). The version-keyed image cache makes that a once-per-release
    # event; the headroom absorbs it instead of losing the leg's signal (GH#352).
    timeout-minutes: 50
    # The matrix axis is the recency-aware active set resolved by resolve-matrix
    # (released channels always + any pre-release at/ahead of stable). Only the
    # released channels are *must-pass*: a beta flake on a pre-release leg (e.g.
    # JG-31's EC-SRP5/btest path is intermittently flaky) is recorded to history
    # but never reds the run — best-effort legs are `continue-on-error`, mirroring
    # `channelPolicy` in scripts/qa-results-db.ts. The downstream
    # `accumulate-and-gate` job is the policy gate + cross-run history accumulator.
    # Explicit versions are on demand; a release sweep arrives via
    # workflow_call. macOS/arm CHR coverage lives in verify-extended.yaml (KVM).
    strategy:
      fail-fast: false
      matrix:
        routeros_channel: ${{ fromJSON(needs.resolve-matrix.outputs.channels) }}
    # Best-effort (non-released) legs never red the workflow on their own; the
    # accumulate-and-gate job is the merge-reddening authority. The released set
    # here must match MUST_PASS_CHANNELS in scripts/qa-results-db.ts.
    continue-on-error: ${{ matrix.routeros_channel != 'stable' && matrix.routeros_channel != 'long-term' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils unzip
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then
           sudo chmod 666 /dev/kvm
           ls -l /dev/kvm
          else
           echo "::warning::/dev/kvm is unavailable; quickchr will use slower TCG emulation."
          fi
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The image cache key must name the RouterOS build this leg will boot:
      # actions/cache only writes on an exact-key MISS, so a static key freezes
      # the first image it ever saw and every later point release is re-downloaded
      # (and never saved). An explicit `routeros_version` pins the leg, so it is
      # the key too. See scripts/chr-cache-key.ts and GH#352.
      - name: Resolve CHR image version for the cache key
        id: chr_version
        env:
          REQUESTED_VERSION: ${{ inputs.routeros_version || '' }}
          CHANNEL: ${{ matrix.routeros_channel }}
        run: |
          bun run scripts/chr-cache-key.ts \
            --channel "$CHANNEL" \
            --version "$REQUESTED_VERSION"
      - name: Cache CHR images
        uses: actions/cache@v6
        with:
          path: ~/.local/share/quickchr/cache
          key: chr-cache-${{ runner.os }}-${{ matrix.routeros_channel }}-${{ steps.chr_version.outputs.version }}
          restore-keys: |
            chr-cache-${{ runner.os }}-${{ matrix.routeros_channel }}-
            chr-cache-${{ runner.os }}-
      - name: Pre-fetch CHR image
        # Download outside every test timeout (#468). On a cache hit it only
        # names the version; it must match the cache key step above.
        env:
          CENTRS_CHR_CHANNEL: ${{ matrix.routeros_channel }}
          CENTRS_CHR_VERSION: ${{ inputs.routeros_version || '' }}
        run: bun run chr:prefetch
      - name: Test against CHR
        id: chr_test
        env:
          CENTRS_CHR_CHANNEL: ${{ matrix.routeros_channel }}
          CENTRS_CHR_VERSION: ${{ inputs.routeros_version || '' }}
          CENTRS_INTEGRATION_REPORT: ${{ runner.temp }}/centrs-integration-report.jsonl
        run: |
          set -eo pipefail
          echo "RouterOS target: ${CENTRS_CHR_VERSION:-channel ${CENTRS_CHR_CHANNEL}}"
          echo "::group::CHR integration output"
          : > /tmp/chr-output.txt
          status=0
          # Per-file isolation + one retry. Real-CHR integration is timing-sensitive
          # (slow QEMU boots, mac-telnet L2 prime latency, a native-api service that
          # lags REST), so a single transient flake must not red the must-pass gate
          # that blocks releases. A *real* regression fails both attempts and still
          # gates (the gate reads this step's outcome). Per-file also avoids the
          # resource contention that fast-fails a later file when many CHRs booted in
          # one bun process. Locally these same cells pass; the reds are CI-only flake.
          for f in test/integration/*.test.ts; do
            echo "::notice::integration $f"
            if CENTRS_RUN_FAST_INTEGRATION=1 bun test "$f" 2>&1 | tee -a /tmp/chr-output.txt; then
              continue
            fi
            echo "::warning::$f failed; retrying once (CHR timing-flake mitigation)"
            if CENTRS_RUN_FAST_INTEGRATION=1 bun test "$f" 2>&1 | tee -a /tmp/chr-output.txt; then
              echo "::notice::$f passed on retry"
            else
              echo "::error::$f failed twice — treating as a real failure"
              status=1
            fi
          done
          echo "::endgroup::"
          exit "$status"
      # actions/cache saves the whole quickchr cache dir in its post-step, and a
      # prefix `restore-keys` hit brings the previous release's images along, so
      # without a bound each point release would grow the saved entry by another
      # 128 MiB image. Keep the newest few (quickchr's own auto-prune cap is
      # 2 GiB — far too loose against the 10 GB repo-wide cache budget). Never
      # fatal: a pruning problem must not red a green test run.
      - name: Bound the saved CHR image cache
        if: always()
        continue-on-error: true
        run: bunx quickchr cache prune --max-size 384M
      # Surface the failing tests (not the whole log) to the run summary so an
      # agent reads the signal directly (github-actions-rich-data instruction).
      - name: Surface result to job summary
        if: always()
        env:
          ROUTEROS_CHANNEL: ${{ matrix.routeros_channel }}
        run: |
          set -o pipefail
          {
            echo "## CHR • ${ROUTEROS_CHANNEL}"
            if grep -qE '\(fail\)' /tmp/chr-output.txt 2>/dev/null; then
              echo "### ❌ Failing tests"
              echo '```'
              grep -E '\(fail\)' /tmp/chr-output.txt || true
              echo '```'
            else
              echo "✅ all CHR tests passed"
            fi
            echo '```'
            tail -40 /tmp/chr-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show integration evidence
        if: always()
        env:
          CENTRS_INTEGRATION_REPORT: ${{ runner.temp }}/centrs-integration-report.jsonl
        run: |
          if [ -f "$CENTRS_INTEGRATION_REPORT" ]; then
           cat "$CENTRS_INTEGRATION_REPORT"
          else
           echo "::warning::No CHR integration evidence report was written."
          fi
      - name: Upload CHR logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: chr-logs-${{ matrix.routeros_channel }}
          path: |
            /tmp/chr-output.txt
            ${{ runner.temp }}/centrs-integration-report.jsonl
          if-no-files-found: warn
          retention-days: 7
      # Persist the run (channel, the version that actually booted, pass/fail,
      # date, commit) to a bun:sqlite history. Additive + always-run: recording
      # never changes the job outcome. All run-block values arrive via env (or
      # built-in $RUNNER_TEMP/$GITHUB_SHA) so user-controllable inputs
      # (routeros_version) are treated as data, never code — no template injection.
      # Only a test step that reached a verdict is recorded. `cancelled` (a run
      # someone or a timeout cancelled) and `skipped` (an earlier setup step
      # failed; that reds this job on its own) are not RouterOS results, and
      # writing them as `fail` faked regressions in qa-history (#442). A run with
      # no legs recorded passes the gate with a warning (scripts/qa-history.ts).
      # `!cancelled()` also covers a test step the cancellation killed that still
      # reports `failure`: a cancelled run records nothing.
      - name: Record QA result
        if: ${{ !cancelled() && (steps.chr_test.outcome == 'success' || steps.chr_test.outcome == 'failure') }}
        continue-on-error: true
        env:
          CHANNEL: ${{ matrix.routeros_channel }}
          REQUESTED_VERSION: ${{ inputs.routeros_version || '' }}
          OUTCOME: ${{ steps.chr_test.outcome == 'success' && 'pass' || 'fail' }}
        run: |
          bun run scripts/qa-results-db.ts \
            --db "$RUNNER_TEMP/qa-results.sqlite" \
            --channel "$CHANNEL" \
            --requested-version "$REQUESTED_VERSION" \
            --outcome "$OUTCOME" \
            --commit "$GITHUB_SHA" \
            --report "$RUNNER_TEMP/centrs-integration-report.jsonl"
      - name: Upload QA results DB
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: qa-results-${{ matrix.routeros_channel }}
          path: ${{ runner.temp }}/qa-results.sqlite
          if-no-files-found: warn

  # Cross-run accumulation + the must-pass gate (the harder half of JG-18). Runs
  # once after the matrix: pulls every per-leg result, appends them to a durable
  # append-log on the `qa-history` branch (artifact retention is finite, and the
  # channel→version drift is the whole point of keeping long history), and fails
  # only when a *released* channel regressed. Beta/test legs are recorded but
  # never gate — see scripts/qa-history.ts.
  #
  # Its name is read back by scripts/qa-nightly.ts (GATE_JOB); rename both.
  accumulate-and-gate:
    name: Accumulate + must-pass gate
    needs: [resolve-matrix, chr-matrix]
    if: ${{ always() && needs.resolve-matrix.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the accumulating history to the qa-history branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7 # zizmor: ignore[artipacked]
        # The one checkout that keeps git credentials: this job pushes to
        # the qa-history branch. It uploads no artifact, so they can't leak.
        with:
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download per-leg QA results
        uses: actions/download-artifact@v8
        with:
          pattern: qa-results-*
          path: incoming
          merge-multiple: false
      # A worktree on the orphan `qa-history` branch (created on first run). The
      # checkout above set up authenticated `origin`, so fetch/push need no token
      # handling. Identity values are static literals, not user input.
      - name: Prepare qa-history worktree
        env:
          QA_BRANCH: qa-history
        run: |
          set -eo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$QA_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$QA_BRANCH"
            git worktree add qa-history "origin/$QA_BRANCH"
            git -C qa-history checkout -B "$QA_BRANCH"
          else
            git worktree add --detach qa-history
            git -C qa-history checkout --orphan "$QA_BRANCH"
            git -C qa-history rm -rf . >/dev/null 2>&1 || true
          fi
      - name: Accumulate history + evaluate must-pass gate
        id: gate
        run: |
          bun run scripts/qa-history.ts \
            --legs incoming \
            --history qa-history/qa-runs.jsonl \
            --summary "$GITHUB_STEP_SUMMARY"
      # The nightly's fingerprint, compared by tomorrow's pre-flight. Written
      # even when the gate failed (a red night is still a completed nightly),
      # but only when the matrix resolved and every must-pass leg reached a
      # verdict. A cancelled run, a resolve that failed after the pre-flight,
      # or a leg that broke in setup tested nothing on that channel, and
      # recording it would let tomorrow skip. It is the pre-flight's own JSON;
      # the reader rejects anything malformed.
      - name: Did every must-pass leg record a result?
        id: legs
        if: ${{ !cancelled() && github.event_name == 'schedule' && needs.resolve-matrix.result == 'success' }}
        run: bun run scripts/qa-nightly.ts legs-recorded --legs incoming
      - name: Record the nightly fingerprint
        if: ${{ !cancelled() && github.event_name == 'schedule' && needs.resolve-matrix.result == 'success' && steps.legs.outputs.recorded == 'true' }}
        env:
          FINGERPRINT: ${{ needs.resolve-matrix.outputs.fingerprint }}
        run: printf '%s\n' "$FINGERPRINT" > qa-history/nightly-fingerprint.json
      # Persist even when the gate failed (a failing run must still land in
      # history) — so this is `always()` and ordered after the gate step.
      - name: Commit accumulated history
        if: always() && github.ref == 'refs/heads/main'
        env:
          QA_BRANCH: qa-history
        run: |
          set -eo pipefail
          cd qa-history
          git add qa-runs.jsonl
          if [ -f nightly-fingerprint.json ]; then git add nightly-fingerprint.json; fi
          if git diff --cached --quiet; then
            echo "No history change to commit."
            exit 0
          fi
          git commit -m "qa: accumulate CHR run ${GITHUB_SHA}"
          # Rebase-retry in case a concurrent dispatch advanced the branch.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${QA_BRANCH}"; then
              exit 0
            fi
            git fetch origin "$QA_BRANCH" || true
            git rebase "origin/${QA_BRANCH}" || git rebase --abort || true
          done
          echo "::warning title=QA history::could not push qa-history after retries"
